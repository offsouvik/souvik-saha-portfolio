<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      user-select: none;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .ui a, .ui button {
      pointer-events: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
      display: inline-block;
    }

    .logo b {
      font-weight: 700;
    }

    .logo span {
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }

    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }

    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
      padding: 0;
      outline: none;
    }

    .arrow svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
      padding: 0;
      outline: none;
    }

    .dot.active {
      background: transparent;
    }

    /* TAGLINE */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }

    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }

    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .cta:hover {
      background: #fff;
      color: #000;
    }

    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }

    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
      pointer-events: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
      pointer-events: none;
    }

    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }

    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }

    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <nav class="dots" aria-label="Pagination">
        <button class="dot" aria-label="Page 1"></button>
        <button class="dot active" aria-label="Page 2"></button>
        <button class="dot" aria-label="Page 3"></button>
      </nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    // ----------------------------------------------------
    // Canvas & WebGL Renderer Setup
    // ----------------------------------------------------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false
    });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // ----------------------------------------------------
    // Offscreen 2D Canvas for Background Headline
    // ----------------------------------------------------
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bgTexture = new THREE.CanvasTexture(bgCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;

    function renderBackgroundCanvas(W, H, currentDpr) {
      bgCanvas.width = Math.floor(W * currentDpr);
      bgCanvas.height = Math.floor(H * currentDpr);

      bgCtx.save();
      bgCtx.scale(currentDpr, currentDpr);
      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, W, H);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
      bgCtx.font = `800 ${fs}px Poppins`;

      const lines = ['Explore', 'New', 'Ideas'];
      let maxLineWidth = 0;
      for (const line of lines) {
        const m = bgCtx.measureText(line).width;
        if (m > maxLineWidth) maxLineWidth = m;
      }

      const maxAllowedWidth = W * (mobile ? 0.9 : 0.5);
      if (maxLineWidth > maxAllowedWidth && maxLineWidth > 0) {
        fs = fs * (maxAllowedWidth / maxLineWidth);
        bgCtx.font = `800 ${fs}px Poppins`;
      }

      bgCtx.fillStyle = '#e9e9e9';
      bgCtx.textAlign = 'center';
      bgCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      for (let i = 0; i < 3; i++) {
        const lineY = cy + cap / 2 + (i - 1) * gap;
        bgCtx.fillText(lines[i], cx, lineY);
      }

      bgCtx.restore();
      bgTexture.needsUpdate = true;
    }

    // Fullscreen quad for background in its own bgScene
    const bgScene = new THREE.Scene();
    const bgQuadGeo = new THREE.PlaneGeometry(2, 2);
    const bgQuadMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        #include <common>
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      uniforms: {
        uTex: { value: bgTexture }
      },
      depthTest: false,
      depthWrite: false
    });
    const bgQuad = new THREE.Mesh(bgQuadGeo, bgQuadMat);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    // ----------------------------------------------------
    // Main 3D Scene Graph
    // ----------------------------------------------------
    const scene = new THREE.Scene();
    const pivot = new THREE.Group();
    scene.add(pivot);

    const spinner = new THREE.Group();
    pivot.add(spinner);
    spinner.rotation.set(-0.42, 0.62, 0.18);

    let cubeMesh = null;

    // ----------------------------------------------------
    // Glass Shader Material
    // ----------------------------------------------------
    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      #include <common>
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specular(vec3 lightDir, float shininess, float diffuseness, vec3 n, vec3 eye) {
        vec3 lightVec = normalize(-lightDir);
        vec3 view = -eye;
        vec3 halfVec = normalize(lightVec + view);
        return pow(max(dot(n, halfVec), 0.0), shininess) + max(0.0, dot(n, lightVec)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n; // do NOT use gl_FrontFacing, three.js flips winding for BackSide
        vec3 eye = normalize(vEye);

        vec3 color = vec3(0.0);
        const int LOOP = 16;
        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec4 texR = texture2D(uTexture, uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texY = texture2D(uTexture, uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texG = texture2D(uTexture, uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic);
          vec4 texC = texture2D(uTexture, uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic);
          vec4 texB = texture2D(uTexture, uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic);
          vec4 texP = texture2D(uTexture, uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic);

          float r = texR.x * 0.5;
          float y = (texY.x * 2.0 + texY.y * 2.0 - texY.z) / 6.0;
          float g = texG.y * 0.5;
          float c = (texC.y * 2.0 + texC.z * 2.0 - texC.x) / 6.0;
          float b = texB.z * 0.5;
          float p = (texP.z * 2.0 + texP.x * 2.0 - texP.y) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          color += vec3(R, G, B);
        }
        color /= float(LOOP);

        // Saturation adjust
        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        // Specular (Blinn-Phong)
        float spec = specular(uLight, uShininess, uDiffuseness, n, eye)
                   + 0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        // Fresnel
        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    function createGlassMaterial(isBack) {
      return new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        uniforms: {
          uTexture: { value: null },
          uResolution: { value: new THREE.Vector2(1, 1) },
          uIorR: { value: 1.15 },
          uIorY: { value: 1.16 },
          uIorG: { value: 1.18 },
          uIorC: { value: 1.22 },
          uIorB: { value: 1.22 },
          uIorP: { value: 1.22 },
          uRefractPower: { value: isBack ? 0.22 : 0.30 },
          uChromatic: { value: 0.5 },
          uSaturation: { value: 1.08 },
          uShininess: { value: 90.0 },
          uDiffuseness: { value: 0.02 },
          uFresnelPower: { value: 5.0 },
          uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
          uBackside: { value: isBack ? 1.0 : 0.0 }
        },
        side: isBack ? THREE.BackSide : THREE.FrontSide,
        depthTest: true,
        depthWrite: true
      });
    }

    const backMat = createGlassMaterial(true);
    const frontMat = createGlassMaterial(false);

    // ----------------------------------------------------
    // Render Targets
    // ----------------------------------------------------
    const rtParams = {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      generateMipmaps: false
    };

    let rtBack = new THREE.WebGLRenderTarget(1, 1, rtParams);
    let rtFront = new THREE.WebGLRenderTarget(1, 1, rtParams);

    backMat.uniforms.uTexture.value = rtBack.texture;
    frontMat.uniforms.uTexture.value = rtFront.texture;

    // ----------------------------------------------------
    // Layout and Sizing
    // ----------------------------------------------------
    function layout() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      renderer.setSize(W, H);
      renderer.setPixelRatio(dpr);

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      const drawW = Math.floor(W * dpr);
      const drawH = Math.floor(H * dpr);
      rtBack.setSize(drawW, drawH);
      rtFront.setSize(drawW, drawH);

      frontMat.uniforms.uResolution.value.set(drawW, drawH);
      backMat.uniforms.uResolution.value.set(drawW, drawH);

      renderBackgroundCanvas(W, H, dpr);

      // Cube placement
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;
      const mobile = (W < 768) || (W / H < 1);
      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const s = (px / H) * visH;
      pivot.scale.set(s, s, s);
    }

    window.addEventListener('resize', layout);

    // ----------------------------------------------------
    // 3D Model Loading
    // ----------------------------------------------------
    function setupMesh(geometry) {
      if (cubeMesh) {
        spinner.remove(cubeMesh);
      }
      cubeMesh = new THREE.Mesh(geometry, frontMat);
      spinner.add(cubeMesh);
      const loaderEl = document.getElementById('loader');
      if (loaderEl) loaderEl.classList.add('done');
    }

    function useFallback() {
      const geo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      geo.center();
      geo.computeBoundingBox();
      const sz = new THREE.Vector3();
      geo.boundingBox.getSize(sz);
      const maxDim = Math.max(sz.x, sz.y, sz.z);
      if (maxDim > 0) geo.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
      setupMesh(geo);
    }

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const geometries = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry) {
              const g = child.geometry.clone();
              if (g.attributes.uv) g.deleteAttribute('uv');
              if (g.attributes.color) g.deleteAttribute('color');
              if (g.attributes.tangent) g.deleteAttribute('tangent');
              const merged = BufferGeometryUtils.mergeVertices(g, 1e-4);
              merged.computeVertexNormals();
              merged.applyMatrix4(child.matrixWorld);
              geometries.push(merged);
            }
          });

          let finalGeo;
          if (geometries.length > 1) {
            finalGeo = BufferGeometryUtils.mergeGeometries(geometries);
          } else if (geometries.length === 1) {
            finalGeo = geometries[0];
          }

          if (finalGeo) {
            finalGeo.center();
            finalGeo.computeBoundingBox();
            const sz = new THREE.Vector3();
            finalGeo.boundingBox.getSize(sz);
            const maxDim = Math.max(sz.x, sz.y, sz.z);
            if (maxDim > 0) finalGeo.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
            setupMesh(finalGeo);
          } else {
            useFallback();
          }
        } catch (err) {
          console.warn('Error processing GLTF geometry:', err);
          useFallback();
        }
      },
      undefined,
      (err) => {
        console.warn('Failed to load GLTF model:', err);
        useFallback();
      }
    );

    // ----------------------------------------------------
    // Interaction & Animation
    // ----------------------------------------------------
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let velocityX = 0;
    let velocityY = 0;
    let dragDeltaAccumX = 0;
    let dragDeltaAccumY = 0;
    let timeSinceRelease = 10.0; // Start with idle drift active
    let arrowSpinRemaining = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      velocityX = 0;
      velocityY = 0;
      dragDeltaAccumX = 0;
      dragDeltaAccumY = 0;
      arrowSpinRemaining = 0; // Dragging cancels the spin
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastPointerX;
      const deltaY = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const dx = deltaX * 0.008;
      const dy = deltaY * 0.008;

      const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(rotY).premultiply(rotX);

      dragDeltaAccumX += dx;
      dragDeltaAccumY += dy;
    });

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');
      timeSinceRelease = 0;
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (_) {}
    }

    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    // Arrow buttons
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    prevBtn.addEventListener('click', () => {
      arrowSpinRemaining -= Math.PI * 0.5; // -90 deg
      velocityX = 0;
      velocityY = 0;
      timeSinceRelease = 0;
    });

    nextBtn.addEventListener('click', () => {
      arrowSpinRemaining += Math.PI * 0.5; // +90 deg
      velocityX = 0;
      velocityY = 0;
      timeSinceRelease = 0;
    });

    // Pagination Dots
    const dots = document.querySelectorAll('.dots .dot');
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        dots.forEach((d) => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    // ----------------------------------------------------
    // Main Render Loop
    // ----------------------------------------------------
    let lastTime = performance.now();
    let loopStarted = false;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      let dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      if (dt > 0.05) dt = 0.05;
      if (dt <= 0) dt = 0.016;

      const frameScale = dt * 60; // Normalized to 60fps frame

      if (isDragging) {
        // Track velocity per 16.67ms frame
        if (dt > 0.0001) {
          const factor = (1 / 60) / dt;
          velocityX = dragDeltaAccumX * factor;
          velocityY = dragDeltaAccumY * factor;
        }
        dragDeltaAccumX = 0;
        dragDeltaAccumY = 0;
        timeSinceRelease = 0;
      } else {
        timeSinceRelease += dt;

        // 1. Arrow spin (smoothly rotate cube ±90° around Y)
        if (Math.abs(arrowSpinRemaining) > 0.0001) {
          const easeFactor = Math.min(1.0, 0.09 * frameScale);
          const step = arrowSpinRemaining * easeFactor;
          arrowSpinRemaining -= step;
          const rotSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
          spinner.quaternion.premultiply(rotSpin);
          if (Math.abs(arrowSpinRemaining) < 0.0005) {
            const finalSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), arrowSpinRemaining);
            spinner.quaternion.premultiply(finalSpin);
            arrowSpinRemaining = 0;
          }
        } else {
          // 2. Inertia after release: keep applying velocity, damped by 0.94^(dt*60) per frame
          if (Math.abs(velocityX) > 1e-6 || Math.abs(velocityY) > 1e-6) {
            const stepX = velocityX * frameScale;
            const stepY = velocityY * frameScale;
            const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), stepX);
            const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), stepY);
            spinner.quaternion.premultiply(rotY).premultiply(rotX);

            const damping = Math.pow(0.94, frameScale);
            velocityX *= damping;
            velocityY *= damping;
          }

          // 3. Idle drift: 0.6s after release, blend in constant slow rotation
          // 0.0035 rad/frame around Y and 0.0012 rad/frame around X (blend ramps 0→1 over 1s)
          if (timeSinceRelease > 0.6) {
            const rampTime = timeSinceRelease - 0.6;
            const blend = Math.min(1.0, rampTime / 1.0);
            const driftY = 0.0035 * frameScale * blend;
            const driftX = 0.0012 * frameScale * blend;
            const rotDriftY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), driftY);
            const rotDriftX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), driftX);
            spinner.quaternion.premultiply(rotDriftY).premultiply(rotDriftX);
          }
        }
      }

      // ----------------------------------------------------
      // Render Pipeline (3 Passes)
      // ----------------------------------------------------
      // 1) Render bgScene -> rtBack
      renderer.setRenderTarget(rtBack);
      renderer.autoClear = true;
      renderer.render(bgScene, camera);

      // 2) Render bgScene -> rtFront, then (autoClear=false) cube with backMat -> rtFront
      renderer.setRenderTarget(rtFront);
      renderer.autoClear = true;
      renderer.render(bgScene, camera);
      if (cubeMesh) {
        renderer.autoClear = false;
        cubeMesh.material = backMat;
        renderer.render(scene, camera);
        renderer.autoClear = true;
      }

      // 3) Render bgScene -> screen, then (autoClear=false, clearDepth) cube with frontMat -> screen
      renderer.setRenderTarget(null);
      renderer.autoClear = true;
      renderer.render(bgScene, camera);
      if (cubeMesh) {
        renderer.autoClear = false;
        renderer.clearDepth();
        cubeMesh.material = frontMat;
        renderer.render(scene, camera);
        renderer.autoClear = true;
      }
    }

    function startLoop() {
      if (!loopStarted) {
        loopStarted = true;
        lastTime = performance.now();
        requestAnimationFrame(animate);
      }
    }

    // Wait for fonts before first draw
    const fontTimeout = new Promise((resolve) => setTimeout(resolve, 2500));
    const fontReady = Promise.all([
      document.fonts.load('800 100px Poppins'),
      document.fonts.ready
    ]);

    Promise.race([fontReady, fontTimeout]).then(() => {
      layout();
      startLoop();
    });

    if (document.fonts) {
      document.fonts.addEventListener('loadingdone', () => {
        layout();
      });
    }
  </script>
</body>
</html>
